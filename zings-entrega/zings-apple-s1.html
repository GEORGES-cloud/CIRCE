<title>ZiNGS · Regalos de España</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:#fff;color:#0E0C0D;font-family:Inter,-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.proto{min-height:100vh}
.proto .ap-nav{position:sticky;top:0}
.ph-av{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#ECE7DF radial-gradient(90% 70% at 50% 35%,rgba(255,255,255,.6),rgba(255,255,255,0) 60%);color:#9A938A;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;text-align:center}
.ph-av > svg{position:static!important;width:44px!important;height:44px!important;inset:auto;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ph-av.dk{background:#1C1819 radial-gradient(90% 70% at 50% 35%,rgba(255,255,255,.08),rgba(255,255,255,0) 60%);color:#8E8790}
@media (prefers-reduced-motion:reduce){.proto *{transition:none!important;scroll-behavior:auto!important}}
.s11{--ink:#0E0C0D;--mute:#6B6560;--paper:#F6F0E6;--sand:#E6C086;--rule:#E4DCD1;--fu:#E3177F;--lk:#C8106B;--lkd:#FF8AC6;--am:#FFC400;background:#fff;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Arial,sans-serif;letter-spacing:-.005em;-webkit-font-smoothing:antialiased;line-height:1.4;
  a{color:inherit;text-decoration:none}
  svg.o{filter:url(#studio)}
  /* textura de superficie: manchas suaves + grano fino, como en el manual */
  .tex{position:relative;isolation:isolate}
  .tex::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;mix-blend-mode:soft-light;opacity:.82;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='g' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' seed='5' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncA type='table' tableValues='0 .55'/></feComponentTransfer></filter><rect width='100%' height='100%' filter='url(%23g)'/></svg>"),url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><filter id='b' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='.011' numOctaves='3' seed='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncA type='table' tableValues='1 1'/></feComponentTransfer></filter><rect width='100%' height='100%' filter='url(%23b)'/></svg>");background-size:180px 180px,600px 600px}
  .tex.dk::before{mix-blend-mode:screen;opacity:.1}
  .tex > *{position:relative;z-index:1}
  /* navegación */
  .ap-nav{position:relative;z-index:5;height:48px;background:rgba(255,255,255,.84);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(14,12,13,.08)}
  .ap-nav ul{list-style:none;margin:0 auto;padding:0 16px;max-width:980px;height:48px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;font-weight:500}
  .ap-nav li{display:flex;align-items:center}.ap-nav li a{opacity:.86;white-space:nowrap;padding:4px 0}.ap-nav li a:hover{opacity:1}
  .ap-nav .lg{display:block;width:26px;height:26px}.ap-nav .lg svg{display:block;width:100%;height:100%}
  .ap-nav .ic{width:15px;height:15px;display:block}
  .ap-nav li.mb{display:none}
  .ap-wrap{max-width:980px;margin:0 auto;padding:0 16px}
  /* cabecera de tienda */
  .ap-store{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding:56px 0 28px;flex-wrap:wrap}
  .ap-store h1{margin:0;font-size:clamp(32px,4vw,48px);font-weight:800;line-height:1.08;letter-spacing:-.022em;max-width:16em}
  .ap-store h1 span{color:var(--mute)}
  .ap-help{display:flex;gap:28px;font-size:14px;color:var(--mute);line-height:1.35}
  .ap-help > div{display:flex;gap:10px;align-items:center}
  .ap-help i{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--fu);color:#fff}
  .ap-help i svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .ap-help b{display:block;color:var(--ink);font-weight:600}.ap-help a{color:var(--lk)}
  /* categorías */
  .ap-cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 16px 44px;max-width:980px;margin:0 auto}
  .ap-cats::-webkit-scrollbar{display:none}
  .ap-cat{flex:0 0 auto;width:112px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px;font-weight:600;text-align:center;line-height:1.2}
  .ap-cat .pc{width:92px;height:80px;display:grid;place-items:center}.ap-cat svg.o{width:72px;height:72px}
  /* titulares de sección */
  .ap-h2{max-width:980px;margin:0 auto;padding:0 16px 22px;font-size:clamp(24px,2.6vw,28px);font-weight:800;line-height:1.14;letter-spacing:-.018em}
  .ap-h2 span{color:var(--mute)}
  .ap-k{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
  /* carrusel */
  .ap-car{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:4px max(16px,calc((100% - 980px)/2 + 16px)) 14px;scroll-padding-left:max(16px,calc((100% - 980px)/2 + 16px))}
  .ap-car::-webkit-scrollbar{display:none}
  .ap-card{flex:0 0 auto;width:min(400px,80vw);aspect-ratio:4/5;border-radius:18px;overflow:hidden;position:relative;scroll-snap-align:start;background:var(--paper);color:var(--ink);box-shadow:2px 4px 12px rgba(14,12,13,.08);transition:transform .5s cubic-bezier(.2,.7,.2,1)}
  .ap-card:hover{transform:scale(1.012)}
  .ap-card .tx{position:absolute;left:30px;right:30px;top:28px;z-index:2}
  .ap-card .k{color:var(--mute)}
  .ap-card h3{margin:8px 0 0;font-size:clamp(22px,2.4vw,28px);font-weight:800;line-height:1.12;letter-spacing:-.02em}
  .ap-card p{margin:6px 0 0;font-size:17px;font-weight:500;color:var(--mute)}
  .ap-card.dk{background:#1C1819;color:#fff}.ap-card.dk .k,.ap-card.dk p{color:rgba(255,255,255,.72)}
  .ap-card.fu{background:var(--fu);color:#fff}.ap-card.fu .k,.ap-card.fu p{color:rgba(255,255,255,.86)}
  .ap-card .im{position:absolute;inset:0}
  .ap-card .im.pr{display:grid;place-items:center;padding-top:36%}
  .ap-card .im.pr svg.o{width:60%}
  .ap-card .im.an{display:grid;place-items:end center;padding-bottom:12%}
  .ap-card .im.an svg{width:34%;height:auto}
  .ap-arrows{max-width:980px;margin:6px auto 0;padding:0 16px;display:flex;justify-content:flex-end;gap:10px}
  .ap-arrows button{width:36px;height:36px;border-radius:50%;border:0;background:var(--paper);color:var(--ink);font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center;transition:background .2s;font-family:inherit}
  .ap-arrows button:hover{background:#ECE3D6}
  /* portada */
  .ap-hero{text-align:center;padding:72px 16px 0;margin-top:64px;border-top:1px solid var(--rule)}
  .ap-hero h2{margin:0;font-size:clamp(40px,5vw,60px);font-weight:800;letter-spacing:-.03em;line-height:1.04}
  .ap-hero h3{margin:12px auto 0;font-size:clamp(19px,2.3vw,27px);font-weight:500;line-height:1.25;max-width:30ch}
  .ap-lk{display:inline-flex;align-items:center;gap:2px;color:var(--lk);font-size:clamp(17px,1.7vw,21px);margin:16px 14px 0;font-weight:500}
  .ap-lk::after{content:"›";font-size:1.15em;line-height:1;margin-left:3px}
  .ap-lk:hover{text-decoration:underline;text-underline-offset:3px}
  .ap-band{position:relative;height:clamp(300px,44vw,560px);margin:40px -16px 0;background:var(--fu);color:#fff;display:grid;place-items:center}
  .ap-band svg.ana{height:38%;width:auto;display:block}
  .ap-band .cap{position:absolute;left:0;right:0;bottom:28px;text-align:center;font-size:11px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:#fff;opacity:.92}
  /* mosaico */
  .ap-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 12px 0}
  .ap-tile{position:relative;min-height:clamp(420px,46vw,580px);background:var(--paper);text-align:center;padding:52px 24px 0;overflow:hidden;display:flex;flex-direction:column;align-items:center}
  .ap-tile.dk{background:var(--ink);color:#fff}
  .ap-tile.sand{background:var(--sand)}
  .ap-tile h2{margin:0;font-size:clamp(28px,3.2vw,40px);font-weight:800;letter-spacing:-.024em;line-height:1.08}
  .ap-tile h3{margin:8px 0 0;font-size:clamp(16px,1.7vw,20px);font-weight:500;line-height:1.35;max-width:30ch}
  .ap-tile .lks .ap-lk{margin-top:10px;font-size:clamp(16px,1.5vw,19px)}
  .ap-tile.dk .ap-lk{color:var(--lkd)}
  .ap-tile.sand .ap-lk{color:var(--ink);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
  .ap-tile .im{flex:none;height:clamp(220px,24vw,310px);width:100%;position:relative;display:grid;place-items:center;margin-top:14px}
  .ap-tile .im svg.o{height:92%;width:auto;max-width:70%}
  .ap-tile.photo .im{flex:1;height:auto;min-height:260px;margin:22px -24px 0;width:auto;align-self:stretch}
  /* regalos por precio */
  .ap-price{max-width:980px;margin:0 auto;padding:22px 16px 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  .ap-pb{background:#fff;border:1px solid var(--rule);border-radius:18px;padding:26px 24px 22px;display:flex;flex-direction:column;gap:4px;min-height:230px;position:relative;overflow:hidden;transition:box-shadow .3s}
  .ap-pb:hover{box-shadow:0 10px 30px rgba(14,12,13,.08)}
  .ap-pb b{font-size:28px;font-weight:800;letter-spacing:-.02em}.ap-pb span{color:var(--mute);font-size:15px;max-width:16ch;font-weight:500}
  .ap-pb .ap-lk{margin:auto 0 0;font-size:17px;align-self:flex-start}
  .ap-pb svg.o{position:absolute;right:-6px;bottom:-14px;width:46%}
  /* para quién */
  .ap-who{max-width:980px;margin:0 auto;padding:60px 16px 0}
  .ap-pills{display:flex;flex-wrap:wrap;gap:10px}
  .ap-pill{display:inline-flex;align-items:center;padding:13px 20px;border-radius:999px;background:var(--paper);font-size:15px;font-weight:600;transition:background .2s}
  .ap-pill:hover{background:#ECE3D6}
  .ap-pill.fu{background:var(--fu);color:#fff}
  /* la diferencia */
  .ap-why{max-width:980px;margin:0 auto;padding:60px 16px 0}
  .ap-why .row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
  .ap-wc{background:var(--paper);border-radius:18px;padding:28px 22px;min-height:230px;display:flex;flex-direction:column;gap:8px}
  .ap-wc i{width:40px;height:40px;border-radius:50%;background:var(--fu);display:grid;place-items:center;margin-bottom:8px}
  .ap-wc i svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .ap-wc b{font-size:17px;font-weight:700;line-height:1.25;letter-spacing:-.01em}.ap-wc span{font-size:14px;color:var(--mute);line-height:1.45;font-weight:500}
  /* síguenos */
  .ap-social{max-width:980px;margin:70px auto 0;padding:0 16px}
  .ap-social .box{display:flex;align-items:center;gap:24px;padding:26px 28px;border:1px solid var(--rule);border-radius:18px;flex-wrap:wrap}
  .ap-social .av{width:88px;height:88px;border-radius:50%;overflow:hidden;flex:none}.ap-social .av svg{display:block;width:100%;height:100%}
  .ap-social b{display:block;font-size:20px;font-weight:800;letter-spacing:-.015em}
  .ap-social p{margin:4px 0 0;color:var(--mute);font-size:15px;font-weight:500;max-width:46ch}
  .ap-social .lks{margin-left:auto;display:flex;gap:4px 18px;flex-wrap:wrap;font-size:15px;color:var(--lk);font-weight:500}
  /* pie */
  .ap-foot{background:var(--paper);color:var(--mute);font-size:12px;margin-top:70px}
  .ap-foot .in{max-width:980px;margin:0 auto;padding:30px 16px 28px}
  .ap-foot svg.logo{height:68px;width:auto;display:block;color:var(--ink);margin-bottom:26px}
  .ap-foot p{margin:0 0 8px;line-height:1.5}
  .ap-foot .cols{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;padding:18px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-top:14px}
  .ap-foot .cols b{display:block;color:var(--ink);font-weight:700;margin-bottom:8px}.ap-foot .cols span{display:block;line-height:2}
  .ap-foot .bot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:14px}
  .ap-foot .bot span + span{border-left:1px solid var(--rule);padding-left:10px;margin-left:10px}
  .ap-foot a{color:var(--lk)}
  @media (max-width:860px){
    .ap-nav li.hd{display:none}.ap-nav li.mb{display:flex}
    .ap-grid,.ap-price,.ap-why .row{grid-template-columns:1fr}
    .ap-foot .cols{grid-template-columns:1fr 1fr}
    .ap-store{padding-top:36px}
    .ap-help{gap:16px;flex-direction:column}
    .ap-social .lks{margin-left:0}
    .ap-band{height:clamp(260px,78vw,360px)}
  }
}
</style>
